[project]
name = "magnum-fultopus"
version = "0.1.0"
description = "A local-first, four-pillar computational research lab: chip thermals, AI on small hardware, astrophysics, and market monitoring, measured on my own machines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
app = "app.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
  "S101",  # assert is fine in tests
  "E501",  # ruff format handles line length; long strings are OK
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"**/test_*.py" = ["S"]
